<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story Continuity — startup preview</title>
<style>
:root{--lumiverse-bg:#191c23;--lumiverse-bg-elevated:#22262f;--lumiverse-border:#363c49;--lumiverse-text:#e5e8ee;--lumiverse-text-muted:#abb3c2;--lumiverse-primary:#7869c7;--lumiverse-success:#91bea2;--lumiverse-warning:#d8b57e}
body{margin:0;background:#111319;color:var(--lumiverse-text);font:14px system-ui,sans-serif;display:grid;grid-template-columns:minmax(300px,1fr) 400px;height:100vh}
aside{background:var(--lumiverse-bg);overflow:auto;padding:20px;box-sizing:border-box;border-left:1px solid var(--lumiverse-border)}main{padding:48px;max-width:650px}main h1{font-size:28px}main p{color:var(--lumiverse-text-muted);line-height:1.7}main button{padding:9px 12px;background:var(--lumiverse-bg-elevated);color:var(--lumiverse-text);border:1px solid var(--lumiverse-border);border-radius:8px;cursor:pointer}
@media(max-width:650px){body{display:block;height:auto}main{padding:20px}aside{border:0}}
.preview-note{margin-top:24px;border:1px solid var(--lumiverse-border);border-radius:12px;padding:20px;background:var(--lumiverse-bg)}.preview-note h2{font-size:17px;margin:0 0 12px}.preview-widget{position:fixed;left:12px;top:42%;display:grid;place-items:center;background:transparent}.preview-controls{display:flex;gap:10px;flex-wrap:wrap}
</style>
<main><h1>Story Continuity Engine</h1><p>Startup and drawer preview using the extension's actual frontend. No model calls or changes to Lumiverse are made.</p><div class="preview-controls"><button id="reset">Reset startup</button><button id="theme">Toggle theme</button></div><article class="preview-note" id="preview-notice"><h2>Story Continuity Engine</h2><p id="notice-body">How would you like to initialize this story?</p></article><p id="event">Choose Create to preview generation. Import demonstrates canceling the file picker.</p></main><aside id="drawer"></aside>
<script type="module">
import { setup } from '../src/frontend.js';
import { fixtureState } from './fixtures.js';
import { publicTrackerSnapshot } from '../src/schemas.js';
let receive, ready=false, processing=false, epoch=0;
const state=fixtureState(), config={enabled:true,showStatusWidget:true,connectionId:'',outputMode:'auto',maxTokens:6144,timeoutMs:120000};
const sendStatus=includePrivate=>receive({type:'story_status',chatId:'preview',config:{...config},code:processing?'processing':ready?'active':'setup',level:ready?'green':'amber',text:processing?'Generating initial profiles and story state…':ready?'Story continuity is current.':'Choose Import Saved Setup or Create From Character Card.',processing,revision:ready?2:0,snapshot:ready?publicTrackerSnapshot(state):null,canImport:!processing,canCreate:!ready&&!processing,canExport:ready,canBegin:false,awaitingSetup:!ready&&!processing,setupNoticeId:'preview-notice',privateStateIncluded:includePrivate,...(includePrivate?{privateState:ready?state:null}:{})});
const ctx={
 components:{},ui:{registerDrawerTab(){return{root:document.querySelector('#drawer'),destroy(){},setBadge(){},activate(){document.querySelector('#drawer').scrollIntoView({behavior:'smooth'})},onActivate(){return()=>{}}}},createFloatWidget(options){const root=document.createElement('div');root.className='preview-widget';root.style.width=options.width+'px';root.style.height=options.height+'px';document.body.append(root);return{root,destroy(){root.remove()},onDragEnd(){return()=>{}}}}},
 dom:{addStyle(css){const el=document.createElement('style');el.textContent=css;document.head.append(el);return()=>el.remove()},cleanup(){},findMessageElement(id){return document.getElementById(id)},inject(target,html){const wrapper=document.createElement('div');wrapper.innerHTML=html;target.append(wrapper);return wrapper},uninject(wrapper){wrapper.remove()}},
 events:{on(){return()=>{}}},onBackendMessage(handler){receive=handler;return()=>{}},getActiveChat(){return{chatId:'preview'}},ready(){},uploads:{async pickFile(){return[]}},
 sendToBackend(payload){document.querySelector('#event').textContent=payload.type;queueMicrotask(()=>{
  if(payload.type==='story_get_status')sendStatus(payload.includePrivate);
  if(payload.type==='story_create_setup'){
    const run=++epoch;processing=true;document.querySelector('#notice-body').textContent='Generating the initial character profiles and starting story state… Please wait.';sendStatus();
    setTimeout(()=>{if(run!==epoch)return;ready=true;processing=false;document.querySelector('#notice-body').textContent='Initial profiles and story state are ready.';sendStatus();receive({type:'story_setup_result',chatId:'preview',requestId:payload.requestId,ok:true,message:'Initial profiles and story state are ready.'})},800);
  }
  if(payload.type==='story_set_widget_visibility'){config.showStatusWidget=payload.showStatusWidget;sendStatus()}
  if(payload.type==='story_save_config'){Object.assign(config,payload.config);receive({type:'story_config_saved',config:{...config}})}
  if(payload.type==='story_get_connections')receive({type:'story_connections',connections:[{id:'local',name:'Local tracker'}]});
 })}
};
setup(ctx);
document.querySelector('#reset').onclick=()=>{epoch++;ready=processing=false;document.querySelector('#notice-body').textContent='How would you like to initialize this story?';sendStatus()};
let light=false;document.querySelector('#theme').onclick=()=>{light=!light;const values=light?['#f8f9fc','#fff','#d8dde7','#242935','#697387']:['#191c23','#22262f','#363c49','#e5e8ee','#abb3c2'];['--lumiverse-bg','--lumiverse-bg-elevated','--lumiverse-border','--lumiverse-text','--lumiverse-text-muted'].forEach((key,index)=>document.documentElement.style.setProperty(key,values[index]));document.body.style.background=light?'#edf0f5':'#111319'};
</script>
</html>
